databaseChangeLog:
  - changeSet:
      id: 002-create-events-table
      author: event-platform
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: location
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: organizer_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_organizer
                    references: users(id)
              - column:
                  name: total_capacity
                  type: int
              - column:
                  name: available_tickets
                  type: int
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
        - createIndex:
            indexName: idx_events_organizer
            tableName: events
            columns:
              - column:
                  name: organizer_id
        - createIndex:
            indexName: idx_events_date
            tableName: events
            columns:
              - column:
                  name: date
