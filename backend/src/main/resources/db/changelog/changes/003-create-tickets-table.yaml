databaseChangeLog:
  - changeSet:
      id: 003-create-tickets-table
      author: event-platform
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_event
                    references: events(id)
              - column:
                  name: seat_number
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: varchar(36)
              - column:
                  name: reserved_at
                  type: timestamp
              - column:
                  name: reserved_by
                  type: varchar(36)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
        - addUniqueConstraint:
            tableName: tickets
            columnNames: event_id, seat_number
            constraintName: uq_tickets_event_seat
        - createIndex:
            indexName: idx_tickets_event_status
            tableName: tickets
            columns:
              - column:
                  name: event_id
              - column:
                  name: status
        - createIndex:
            indexName: idx_tickets_status_reserved_at
            tableName: tickets
            columns:
              - column:
                  name: status
              - column:
                  name: reserved_at
