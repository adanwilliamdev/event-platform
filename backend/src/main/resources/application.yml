spring:
  application:
    name: event-platform
  
  datasource:
    url: jdbc:postgresql://localhost:5433/eventdb
    username: eventuser
    password: eventpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: your_mailtrap_username
    password: your_mailtrap_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
      refresh-expiration: 604800000
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

stripe:
  api-key: sk_test_your_stripe_key
  webhook-secret: whsec_your_webhook_secret

app:
  ticket:
    hold-duration: 10
  rabbitmq:
    exchange: ticket.exchange
    queue: ticket.queue
    routing-key: ticket.routing-key

logging:
  level:
    com.eventplatform: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO
