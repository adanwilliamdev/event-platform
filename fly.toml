# Configuração do Fly.io para o Palco (Event Platform).
# Antes do primeiro deploy, troque "app" pelo nome único da sua aplicação
# (ou deixe em branco e rode `fly launch`, que preenche automaticamente).

app = "palco-event-platform"
primary_region = "gru" # São Paulo. Troque se preferir outra região.

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  DATABASE_PATH = "/data/eventplatform.db"

# Volume persistente para o banco SQLite — sem isso, os dados são perdidos
# a cada deploy/restart da máquina.
# Crie antes do primeiro deploy com:
#   fly volumes create palco_data --region gru --size 1
[mounts]
  source = "palco_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # evita derrubar conexões WebSocket ativas
  auto_start_machines = true
  min_machines_running = 1     # mantém 1 única instância viva (estado em memória)
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
